
<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <title>Chess Board</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      border: 3px solid #333;
    }
    .cell {
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 34px;
    }
    .white { background-color: #eee; }
    .black { background-color: #769656; }
  </style>
</head>
<body>

  <div class="board">

    <div class="white cell"></div>

    <div class="white cell"></div>

</body></html>
