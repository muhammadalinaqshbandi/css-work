<!DOCTYPE html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #800080;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      color: white;
      flex-direction: column;
    }

    .logo {
      background-color: white;
      border-radius: 50%;
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      color: black;
      font-weight: bold;
      font-size: 12px;
    }

    h1 {
      margin: 10px 0;
      font-size: 28px;
    }

    p {
      margin-bottom: 30px;
      font-size: 16px;
      max-width: 300px;
    }

    .countdown-box {
      border: 1px solid #fff;
      padding: 20px;
      display: flex;
      gap: 20px;
    }

    .time-unit {
      font-size: 16px;
    }

    .number {
      font-weight: bold;
      font-size: 24px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="logo">
    <div class="logo-text">Geeks Help</div>
  </div>

  <h1>Coming soon</h1>
  <p>We are building special thing for you! and this will be coming within</p>

  <div class="countdown-box">
    <div class="time-unit">
      <span class="number">1</span>
      Days
    </div>
    <div class="time-unit">
      <span class="number">21</span>
      Hours
    </div>
    <div class="time-unit">
      <span class="number">48</span>
      Minutes
    </div>
    <div class="time-unit">
      <span class="number">26</span>
      Seconds
    </div>
  </div>


</body></html>
